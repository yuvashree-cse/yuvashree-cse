<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200"
     height="560"
     viewBox="0 0 1200 560"
     role="img"
     aria-labelledby="about-title about-desc">

  <title id="about-title">About Yuvashree</title>
  <desc id="about-desc">
    Computer Science student, developer and creative enthusiast.
  </desc>

  <defs>
    <linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b16"/>
      <stop offset="55%" stop-color="#11152a"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>

    <linearGradient id="about-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="about-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".075"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <radialGradient id="about-glow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="about-grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none"
            stroke="#a78bfa" stroke-opacity=".08"/>
    </pattern>

    <filter id="about-blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("data:font/woff2;base64,__SPACE_REGULAR__") format("woff2");
        font-weight: 400;
      }

      @font-face {
        font-family: "Space Grotesk";
        src: url("data:font/woff2;base64,__SPACE_BOLD__") format("woff2");
        font-weight: 700;
      }

      @font-face {
        font-family: "JetBrains Mono";
        src: url("data:font/woff2;base64,__MONO_REGULAR__") format("woff2");
        font-weight: 400;
      }

      .about-heading {
        font-family: "Space Grotesk", sans-serif;
        font-size: 35px;
        font-weight: 700;
        fill: #f1f2ff;
      }

      .about-subheading {
        font-family: "Space Grotesk", sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #e6e8ff;
      }

      .about-body {
        font-family: "Space Grotesk", sans-serif;
        font-size: 16px;
        fill: #b8c0df;
      }

      .about-small {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        fill: #9da8cd;
        letter-spacing: 1px;
      }

      .about-card {
        fill: url(#about-card);
        stroke: #a78bfa;
        stroke-opacity: .23;
        stroke-width: 1;
      }

      .about-float {
        animation: about-float 4s ease-in-out infinite;
      }

      .about-pulse {
        animation: about-pulse 2.5s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      @keyframes about-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes about-pulse {
        0%, 100% { opacity: .5; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" rx="26" fill="url(#about-bg)"/>
  <rect width="1200" height="560" rx="26" fill="url(#about-grid)"/>

  <ellipse cx="1000" cy="270" rx="270" ry="250"
           fill="url(#about-glow)" filter="url(#about-blur)"/>

  <rect x="16" y="16" width="1168" height="528"
        rx="20" fill="none"
        stroke="#a78bfa" stroke-opacity=".23"/>

  <!-- Section heading -->
  <text x="55" y="75" class="about-small">
    01 / THE HUMAN BEHIND THE CODE
  </text>

  <text x="55" y="125" class="about-heading">
    A little about me
  </text>

  <rect x="55" y="145" width="210" height="3"
        rx="2" fill="url(#about-accent)"/>

  <!-- Introduction card -->
  <rect x="55" y="175" width="650" height="135"
        rx="17" class="about-card"/>

  <circle cx="88" cy="210" r="5" fill="#22d3ee"
          class="about-pulse"/>

  <text x="108" y="215" class="about-small">
    CURRENTLY
  </text>

  <text x="80" y="255" class="about-subheading">
    Computer Science &amp; Engineering Student
  </text>

  <text x="80" y="284" class="about-body">
    Learning, experimenting and turning ideas into projects.
  </text>

  <!-- Academic card -->
  <rect x="55" y="330" width="310" height="155"
        rx="17" class="about-card"/>

  <text x="80" y="368" class="about-small">
    EDUCATION
  </text>

  <text x="80" y="405" class="about-subheading">
    B.E. Computer Science
  </text>

  <text x="80" y="438" class="about-body">
    St. Joseph's College of
  </text>

  <text x="80" y="461" class="about-body">
    Engineering, Chennai
  </text>

  <!-- Interests card -->
  <rect x="385" y="330" width="320" height="155"
        rx="17" class="about-card"/>

  <text x="410" y="368" class="about-small">
    CURRENT INTERESTS
  </text>

  <text x="410" y="407" class="about-body">
    AI &amp; Large Language Models
  </text>

  <text x="410" y="438" class="about-body">
    Full-Stack Development
  </text>

  <text x="410" y="469" class="about-body">
    Creative Technology
  </text>

  <!-- Character backdrop -->
  <ellipse cx="940" cy="455" rx="190" ry="25"
           fill="#a78bfa" opacity=".12"
           class="about-pulse"/>

  <!-- Character -->
  <image x="735" y="95"
         width="435" height="420"
         preserveAspectRatio="xMidYMid meet"
         href="__POINTING_IMAGE__"
         xlink:href="__POINTING_IMAGE__"/>

  <!-- Floating decorations -->
  <g class="about-float">
    <circle cx="820" cy="125" r="4" fill="#22d3ee"/>
    <circle cx="845" cy="150" r="2" fill="#f472b6"/>
  </g>

  <g class="about-float" style="animation-delay:-2s">
    <circle cx="1080" cy="100" r="4" fill="#a78bfa"/>
    <circle cx="1100" cy="125" r="2" fill="#22d3ee"/>
  </g>

  <!-- Footer -->
  <text x="55" y="520" class="about-small">
    BEYOND CODE: DRAWING • PAPER CRAFT • GAMING • TRAVEL
  </text>

  <circle cx="1135" cy="515" r="4" fill="#22d3ee"
          class="about-pulse"/>

</svg>